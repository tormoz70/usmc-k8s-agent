# Three demo namespaces for Cluster tab: 2 Deployments × 1 Pod each.
# Namespace objects live in namespaces.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: test-namespace-3
  labels:
    app: frontend
    app.kubernetes.io/part-of: test-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: test-data
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: test-namespace-3
  labels:
    app: backend
    app.kubernetes.io/part-of: test-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/part-of: test-data
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date -u +%H:%M:%S) [test-namespace-3/backend] ok"
                sleep 5
              done
---
