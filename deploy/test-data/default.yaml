# default: web deployment + log generators (label app=test for logs.collect)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: default
  labels:
    app: web
    app.kubernetes.io/part-of: test-data
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/part-of: test-data
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: default
  labels:
    app: api
    app.kubernetes.io/part-of: test-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/part-of: test-data
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              while true; do
                i=$((i+1))
                echo "$(date -u +%H:%M:%S) [default/api] GET /health ok req=$i"
                sleep 3
              done
---
apiVersion: v1
kind: Pod
metadata:
  name: logger-a
  namespace: default
  labels:
    app: test
    logger: a
    app.kubernetes.io/part-of: test-data
spec:
  containers:
    - name: logger
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            echo "$(date -u +%H:%M:%S) [default/logger-a] heartbeat"
            sleep 2
          done
---
apiVersion: v1
kind: Pod
metadata:
  name: logger-b
  namespace: default
  labels:
    app: test
    logger: b
    app.kubernetes.io/part-of: test-data
spec:
  containers:
    - name: logger
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            echo "$(date -u +%H:%M:%S) [default/logger-b] event processed"
            sleep 4
          done
