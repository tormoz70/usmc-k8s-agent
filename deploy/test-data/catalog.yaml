apiVersion: apps/v1
kind: Deployment
metadata:
  name: products
  namespace: catalog
  labels:
    app: products
    app.kubernetes.io/part-of: test-data
spec:
  replicas: 2
  selector:
    matchLabels:
      app: products
  template:
    metadata:
      labels:
        app: products
        app.kubernetes.io/part-of: test-data
    spec:
      containers:
        - name: catalog
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer
  namespace: catalog
  labels:
    app: indexer
    app.kubernetes.io/part-of: test-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: indexer
  template:
    metadata:
      labels:
        app: indexer
        app.kubernetes.io/part-of: test-data
    spec:
      containers:
        - name: indexer
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              while true; do
                i=$((i+1))
                echo "$(date -u +%H:%M:%S) [catalog/indexer] indexed sku=$i"
                sleep 2
              done
---
apiVersion: v1
kind: Pod
metadata:
  name: logger
  namespace: catalog
  labels:
    app: test
    logger: catalog
    app.kubernetes.io/part-of: test-data
spec:
  containers:
    - name: logger
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            echo "$(date -u +%H:%M:%S) [catalog/logger] sync complete"
            sleep 5
          done
