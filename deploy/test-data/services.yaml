# Demo Services for Cluster tab / k8s.api list fixtures (one per workload namespace).
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: test-namespace-1
  labels:
    app: web
    app.kubernetes.io/part-of: test-data
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
