# Namespace-scoped RoleBindings: grant each agent SA access in test namespaces.
# Subjects cover local + test-v1 + test-v2 ServiceAccounts.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uamcsa-agent
  namespace: test-namespace-1
  labels:
    app.kubernetes.io/part-of: test-data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-agent
subjects:
  - kind: ServiceAccount
    name: uamcsa
    namespace: uamc-agent
  - kind: ServiceAccount
    name: uamcsa
    namespace: uamc-agent-v1
  - kind: ServiceAccount
    name: uamcsa
    namespace: uamc-agent-v2
---
