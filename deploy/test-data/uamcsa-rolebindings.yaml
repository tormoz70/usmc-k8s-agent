# Namespace-scoped RoleBindings: grant uamcsa (in uamc-agent) access from each test namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uamcsa-agent
  namespace: test-namespace-1
  labels:
    app.kubernetes.io/part-of: test-data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-agent
subjects:
  - kind: ServiceAccount
    name: uamcsa
    namespace: uamc-agent
---
