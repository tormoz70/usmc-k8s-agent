# Namespace-scoped RoleBindings: grant uamcsa (in k8s-agent) access from each test namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uamcsa-agent
  namespace: default
  labels:
    app.kubernetes.io/part-of: test-data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-agent
subjects:
  - kind: ServiceAccount
    name: uamcsa
    namespace: k8s-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uamcsa-agent
  namespace: payments
  labels:
    app.kubernetes.io/part-of: test-data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-agent
subjects:
  - kind: ServiceAccount
    name: uamcsa
    namespace: k8s-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uamcsa-agent
  namespace: catalog
  labels:
    app.kubernetes.io/part-of: test-data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-agent
subjects:
  - kind: ServiceAccount
    name: uamcsa
    namespace: k8s-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uamcsa-agent
  namespace: demo
  labels:
    app.kubernetes.io/part-of: test-data
roleRef:
  apiGroup: rbac.authorization.k8s.io
