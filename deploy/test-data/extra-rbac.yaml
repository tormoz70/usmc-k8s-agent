# Extra demo RoleBindings so list returns more than the agent SA binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-reader
  namespace: test-namespace-1
  labels:
    app.kubernetes.io/part-of: test-data
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-reader-binding
  namespace: test-namespace-1
  labels:
    app.kubernetes.io/part-of: test-data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-reader
subjects:
  - kind: ServiceAccount
    name: default
    namespace: test-namespace-1
---
