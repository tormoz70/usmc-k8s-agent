apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: logs-node-agent
  namespace: uamc-agent
  labels:
    app.kubernetes.io/part-of: uamc-agent
    app.kubernetes.io/component: logs-node-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: uamc-agent
      app.kubernetes.io/component: logs-node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: uamc-agent
        app.kubernetes.io/component: logs-node-agent
    spec:
      serviceAccountName: uamcsa
      tolerations:
        - operator: Exists
      containers:
        - name: logs-node
          image: k8s-agent:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            capabilities:
              drop:
                - ALL
          ports:
            - name: logs-node
              containerPort: 8083
          env:
            - name: AGENT_COMPONENT
              value: logs-node
            - name: AGENT_IMPLEMENTATION
              value: v2
            - name: LOGS_BACKEND
              value: nodelocal
            - name: CLUSTER_ID
              value: local
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: AGENT_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOGS_NODE_HTTP_PORT
              value: "8083"
            - name: POD_LOGS_ROOT
              value: /var/log/pods
            - name: POLICY_FILE
              value: /etc/k8s-agent/policy/policy.yaml
            - name: POLICY_NAMESPACES_FILE
              value: /etc/k8s-agent/policy/namespaces.yaml
            - name: FEATURES_FILE
              value: /etc/k8s-agent/policy/features.yaml
            - name: KAFKA_BROKERS
              value: localhost:9092
            - name: HTTP_INTERNAL_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k8s-agent-internal-token
                  key: token
          volumeMounts:
            - name: policy
              mountPath: /etc/k8s-agent/policy
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: logs-node
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: logs-node
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: policy
          configMap:
            name: k8s-agent-policy
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
