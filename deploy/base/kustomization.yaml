apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: k8s-agent

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: k8s-agent-policy
    files:
      - policy.yaml=policy/policy.yaml
      - namespaces.yaml=policy/namespaces.yaml

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
