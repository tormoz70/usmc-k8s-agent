apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress
  namespace: uamc-agent
  labels:
    app.kubernetes.io/part-of: uamc-agent
    app.kubernetes.io/component: egress
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/part-of: uamc-agent
      app.kubernetes.io/component: egress
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: uamc-agent
        app.kubernetes.io/component: egress
    spec:
      serviceAccountName: uamcsa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: k8s-agent:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENT_COMPONENT
              value: egress
            - name: AGENT_SERVICE_URL
              value: http://agent-service-http:8081
            - name: CLUSTER_ID
              value: local
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENT_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HTTP_PORT
              value: "8080"
            - name: LEADER_LEASE_NAME
              value: k8s-agent-egress-leader
            - name: KAFKA_BROKERS
              value: host.docker.internal:9092
            - name: POLICY_FILE
              value: /etc/k8s-agent/policy/policy.yaml
            - name: POLICY_NAMESPACES_FILE
              value: /etc/k8s-agent/policy/namespaces.yaml
            - name: HTTP_INTERNAL_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k8s-agent-internal-token
                  key: token
          volumeMounts:
            - name: policy
              mountPath: /etc/k8s-agent/policy
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: policy
          configMap:
            name: k8s-agent-policy
