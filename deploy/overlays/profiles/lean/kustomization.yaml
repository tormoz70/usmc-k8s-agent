apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Lean resource profile: replicas=1, features-minimal, tight logs pool, emptyDir 512Mi.
resources:
  - ../../../base

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: k8s-agent-policy
    behavior: merge
    files:
      - features.yaml=features-minimal.yaml

patches:
  - target:
      kind: Deployment
      name: ingress
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ingress
      spec:
        replicas: 1
  - target:
      kind: Deployment
      name: egress
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: egress
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: gateway
                env:
                  - name: K8S_API_QPS
                    value: "20"
                  - name: K8S_API_BURST
                    value: "40"
  - target:
      kind: Deployment
      name: agent-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: agent-service
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: agent
                env:
                  - name: K8S_API_QPS
                    value: "20"
                  - name: K8S_API_BURST
                    value: "40"
                  - name: LOGS_COLLECT_MAX_JOBS
                    value: "2"
                  - name: LOGS_COLLECT_MAX_BYTES
                    value: "52428800"
                resources:
                  limits:
                    memory: 512Mi
                  requests:
                    cpu: 100m
                    memory: 128Mi
            volumes:
              - name: logs-temp
                emptyDir:
                  sizeLimit: 512Mi
