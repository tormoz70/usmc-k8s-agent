apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: uamc-agent

resources:
  - ../../base

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: k8s-agent-policy
    behavior: merge
    files:
      - namespaces.yaml=policy/namespaces.yaml

secretGenerator:
  - name: k8s-agent-internal-token
    literals:
      - token=local-dev-internal-token

patches:
  # Prefer strategic merge by env name — JSON index patches break when env order changes.
  - target:
      kind: Deployment
      name: egress
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: egress
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: gateway
                env:
                  - name: KAFKA_BROKERS
                    value: host.docker.internal:9092
  - target:
      kind: Deployment
      name: agent-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: agent-service
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: agent
                env:
                  - name: LOGS_TEMP_DIR
                    value: /var/tmp/logs-collect
                  - name: S3_ENDPOINT
                    value: http://host.docker.internal:9000
                  - name: S3_FORCE_PATH_STYLE
                    value: "true"
                  - name: KAFKA_BROKERS
                    value: host.docker.internal:9092
