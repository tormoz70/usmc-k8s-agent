apiVersion: v1
kind: Namespace
metadata:
  name: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: app
  labels:
    app: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              i=0
              while true; do
                i=$((i+1))
                if [ $((i % 10)) -eq 0 ]; then
                  echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) ERROR simulated failure tick=$i"
                else
                  echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) INFO tick=$i"
                fi
                sleep 5
              done
