apiVersion: v1
kind: Namespace
metadata:
  name: k8s-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-agent
  namespace: k8s-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-agent
  namespace: k8s-agent
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-agent
  namespace: k8s-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-agent
subjects:
  - kind: ServiceAccount
    name: k8s-agent
    namespace: k8s-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-agent
rules:
  - apiGroups: [networking.istio.io]
    resources: [virtualservices, destinationrules, gateways]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-agent
subjects:
  - kind: ServiceAccount
    name: k8s-agent
    namespace: k8s-agent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-agent-policy
  namespace: k8s-agent
data:
  policy.yaml: |
    allowed_gvk:
      - {group: networking.istio.io, version: v1beta1, kind: VirtualService}
      - {group: networking.istio.io, version: v1beta1, kind: DestinationRule}
      - {group: networking.istio.io, version: v1beta1, kind: Gateway}
      - {group: apps, version: v1, kind: Deployment}
      - {group: "", version: v1, kind: Pod}
    allowed_namespaces: [app, istio-system, k8s-agent]
    allowed_command_types:
      - resource.list
      - file.fetch
      - watch.subscribe
      - watch.unsubscribe
      - logs.stream.subscribe
      - logs.stream.unsubscribe
    issuer_rules:
      - issuer: core-prod
        namespaces: [app, istio-system]
    file_fetch:
      max_bytes: 1073741824
      max_concurrent_targets: 50
      allowed_domains: []
    log_stream:
      max_subscriptions: 100
      max_pattern_length: 512
    exclude_secret_kind: true
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-agent
  namespace: k8s-agent
  labels:
    app: k8s-agent
spec:
  selector:
    app: k8s-agent
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-agent
  namespace: k8s-agent
  labels:
    app: k8s-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-agent
  template:
    metadata:
      labels:
        app: k8s-agent
    spec:
      serviceAccountName: k8s-agent
      containers:
        - name: agent
          image: k8s-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC_COMMANDS_IN
              value: "commands.in"
            - name: KAFKA_TOPIC_COMMANDS_OUT
              value: "commands.results"
            - name: KAFKA_TOPIC_CLUSTER_EVENTS
              value: "cluster.events"
            - name: KAFKA_TOPIC_DLQ
              value: "commands.dlq"
            - name: POLICY_FILE
              value: "/etc/k8s-agent/policy.yaml"
            - name: LEADER_ELECTION_ENABLED
              value: "true"
            - name: LEADER_LEASE_NAME
              value: "k8s-agent-leader"
            - name: LEADER_LEASE_NAMESPACE
              value: "k8s-agent"
            - name: TEMP_DIR
              value: "/tmp/k8s-agent"
          volumeMounts:
            - name: policy
              mountPath: /etc/k8s-agent
              readOnly: true
            - name: temp
              mountPath: /tmp/k8s-agent
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: policy
          configMap:
            name: k8s-agent-policy
        - name: temp
          emptyDir: {}
