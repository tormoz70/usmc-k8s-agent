services:
  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://host.docker.internal:9092
    ports:
      - "9092:9092"

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --address ":9010" --console-address ":9011"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9010"
      - "9011:9011"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:9092
    depends_on:
      - redpanda

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9010 minioadmin minioadmin; do echo waiting for minio...; sleep 2; done &&
      mc mb --ignore-existing local/logs-bundles &&
      echo bucket logs-bundles ready"

  mock-core-ui:
    build:
      context: .
      dockerfile: hack/mock-core-ui/Dockerfile
    ports:
      - "8090:8090"
    environment:
      KAFKA_BROKERS: redpanda:9092
      S3_ENDPOINT: http://minio:9010
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      FIXTURES_DIR: /fixtures
      FEATURES_DIR: /policy
      KUBECONFIG: /kube/config
      # kind kubeconfig points at 127.0.0.1 — rewrite for access from this container
      KUBE_HOST_REWRITE: host.docker.internal
      AGENT_NAMESPACE: uamc-agent
      MINIO_CONSOLE_URL: http://localhost:9011
      AGENT_HTTP_URL: http://host.docker.internal:8080
      # Agent 1/2 targets are embedded in the binary; optional override:
      # MOCK_CORE_UI_TARGETS: /targets/targets.yaml
      # optional: HTTP_BEARER_TOKEN if agent requires it for /v1/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./test/fixtures:/fixtures:ro
      - ./deploy/base/policy:/policy:ro
      # Windows: USERPROFILE; Linux/macOS: HOME. Override with KUBECONFIG host path if needed.
      - ${KUBECONFIG_HOST_PATH:-${USERPROFILE:-${HOME}}/.kube/config}:/kube/config:ro
    depends_on:
      - redpanda
      - minio
