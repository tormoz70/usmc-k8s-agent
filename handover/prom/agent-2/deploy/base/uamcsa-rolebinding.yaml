# Namespace-scoped RoleBinding: uamcsa permissions inside uamc-agent only.
# Application namespaces get separate RoleBindings (see deploy/test-data/uamcsa-rolebindings.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uamcsa-agent
  namespace: uamc-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-agent
subjects:
  - kind: ServiceAccount
    name: uamcsa
    namespace: uamc-agent
