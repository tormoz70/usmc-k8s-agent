apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: uamc-agent
  labels:
    app.kubernetes.io/part-of: uamc-agent
    app.kubernetes.io/component: agent-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/part-of: uamc-agent
      app.kubernetes.io/component: agent-service
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: uamc-agent
        app.kubernetes.io/component: agent-service
    spec:
      serviceAccountName: uamcsa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: k8s-agent:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: internal
              containerPort: 8081
          env:
            - name: AGENT_COMPONENT
              value: agent-service
            - name: AGENT_IMPLEMENTATION
              value: v1
            - name: LOGS_BACKEND
              value: api
            - name: CLUSTER_ID
              value: local
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENT_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: INTERNAL_HTTP_PORT
              value: "8081"
            - name: POLICY_FILE
              value: /etc/k8s-agent/policy/policy.yaml
            - name: POLICY_NAMESPACES_FILE
              value: /etc/k8s-agent/policy/namespaces.yaml
            - name: FEATURES_FILE
              value: /etc/k8s-agent/policy/features.yaml
            - name: LOGS_TEMP_DIR
              value: /var/tmp/logs-collect
            - name: S3_ENDPOINT
              value: http://host.docker.internal:9010
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: KAFKA_BROKERS
              value: host.docker.internal:9092
            - name: HTTP_INTERNAL_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k8s-agent-internal-token
                  key: token
          volumeMounts:
            - name: policy
              mountPath: /etc/k8s-agent/policy
            - name: logs-temp
              mountPath: /var/tmp/logs-collect
          livenessProbe:
            httpGet:
              path: /healthz
              port: internal
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: internal
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: policy
          configMap:
            name: k8s-agent-policy
        - name: logs-temp
          emptyDir:
            sizeLimit: 2Gi
